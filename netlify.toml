[build]
  base    = "admin-dashboard"
  publish = "dist"
  command = "npm run build"

[build.environment]
  VITE_API_URL = "https://serene-passion-production-cd82.up.railway.app"

# Functions live under the base directory (admin-dashboard/netlify/functions).
[functions]
  directory = "netlify/functions"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
