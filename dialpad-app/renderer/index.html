<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PracticeDesk Dialpad</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0f1e;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .app {
    width: 340px;
    padding: 20px 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 18px;
  }
  .logo {
    font-size: 15px;
    font-weight: 700;
    color: #e2e8f0;
    letter-spacing: -0.3px;
  }
  .sub {
    font-size: 11px;
    color: #64748b;
    font-weight: 500;
  }

  /* ── Status bar ── */
  .status-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #111827;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 14px;
    font-size: 12px;
    color: #94a3b8;
    min-height: 36px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-green  { background: #22c55e; }
  .dot-amber  { background: #f59e0b; animation: pulse 1s infinite; }
  .dot-grey   { background: #475569; }
  .dot-red    { background: #ef4444; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  /* ── Number row ── */
  .number-row {
    display: flex;
    align-items: center;
    background: #111827;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
    min-height: 52px;
  }
  .number-display {
    flex: 1;
    font-size: 22px;
    font-family: 'SF Mono', 'Consolas', monospace;
    letter-spacing: 2px;
    color: #f1f5f9;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .number-display:empty::before {
    content: 'Enter number';
    color: #334155;
    font-size: 14px;
    font-family: inherit;
    letter-spacing: 0;
  }
  .btn-back {
    background: none;
    border: none;
    color: #475569;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    transition: color 0.15s;
    line-height: 1;
  }
  .btn-back:hover { color: #94a3b8; }

  /* ── Quick dials ── */
  .quick-dials {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 12px;
  }
  .quick-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s, border-color 0.15s;
  }
  .quick-btn:hover { background: #1e3a5f; border-color: #2563eb; }
  .ql { display: block; font-size: 11px; font-weight: 500; color: #e2e8f0; }
  .qn { display: block; font-size: 10px; font-family: monospace; color: #64748b; margin-top: 1px; }

  /* ── Keypad ── */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .key {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111827;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 12px 6px;
    cursor: pointer;
    transition: background 0.1s, border-color 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .key:hover  { background: #1e293b; border-color: #334155; }
  .key:active { background: #1e3a5f; border-color: #2563eb; }
  .kd { font-size: 20px; font-weight: 500; color: #f1f5f9; line-height: 1; }
  .ks { font-size: 8px; color: #475569; letter-spacing: 1.5px; margin-top: 3px; }

  /* ── Call controls (visible only when active) ── */
  .call-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin-bottom: 14px;
  }
  .btn-mute {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    color: #94a3b8;
    font-size: 12px;
    padding: 8px 16px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .btn-mute:hover { background: #334155; color: #e2e8f0; }
  .btn-mute.muted { background: #7f1d1d; border-color: #ef4444; color: #fca5a5; }
  .timer {
    font-size: 20px;
    font-family: monospace;
    color: #22c55e;
    letter-spacing: 2px;
  }

  /* ── Dial row ── */
  .dial-row {
    display: flex;
    justify-content: center;
  }
  .btn-call, .btn-hangup {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }
  .btn-call {
    background: #16a34a;
  }
  .btn-call:hover  { background: #15803d; }
  .btn-call:active { transform: scale(0.94); }
  .btn-call:disabled { background: #1e293b; cursor: not-allowed; box-shadow: none; }

  .btn-hangup {
    background: #dc2626;
  }
  .btn-hangup:hover  { background: #b91c1c; }
  .btn-hangup:active { transform: scale(0.94); }
</style>
</head>
<body>
<script src="bundle.js"></script>
</body>
</html>
