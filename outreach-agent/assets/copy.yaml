verticals:

  dentist:
    wa_message: |
      Hi *{name}* 👋

      I'm Henry from *PracticeDesk* — an AI office assistant across phone, WhatsApp, and email for dental clinics.

      Here's what clinics in {city} are using us for:

      • 📅 *After-hours bookings* — patients search for appointments at 10 PM. We answer. You confirm in the morning.
      • 💬 *WhatsApp reminders* — 73% of patients respond vs ignoring phone calls
      • 🔄 *Auto-rebook no-shows* — a follow-up message goes out automatically. No staff effort.
      • 📋 *Intake & confirmations* — new patient forms, pre-appointment instructions, all on WhatsApp
      • 📊 *Free your front desk* — 3–5 hours of phone tag eliminated every week

      Most clinics see *no-shows drop by 30%* within the first month.

      *14-day free trial. Live in 15 minutes. No lock-in.*

      Worth a look? → practicedesk.live

    sophie_opener: >
      Hi, this is Sophie from PracticeDesk.
      Quick question — when a patient calls after you've closed for the day,
      or when the front desk is slammed, what happens to that call right now?

    sophie_insight: >
      Here's what we see: most patients searching in the evening won't leave a
      voicemail — they call the next practice.
      So the lost booking never even shows up as a missed call.
      It's invisible, which is why it's easy to under-rate.

    sophie_pain_question: >
      When the phone rings and no one can grab it — after hours, or mid-treatment —
      where does that call go today? Voicemail, or just missed?

    # Signal-aware openers — loaded by Change #9 for pain_signal lookup.
    # Change #10 prospecting cron stores pain_signal on the lead;
    # place_sophie_call passes it to Vapi variableValues so Sophie selects the
    # matching opener from this table. Each maps to the sophie-dental-call.md spec.
    sophie_signal_openers:
      job_ad_frontdesk: >
        Hi, I'm Sophie from PracticeDesk — I noticed you're hiring for the front
        desk, so the timing felt right to reach out. Good reception staff are hard
        to find and keep. We help practices cover the phones and bookings so a gap
        up front never means a missed patient. Could I share how?
      no_online_booking: >
        Hi, I'm Sophie from PracticeDesk. I had a quick look and it seems patients
        book by calling — which works well, though a lot of practices find people
        want to book in the evening once you're closed. We add 24/7 booking across
        phone, WhatsApp and email so you catch those too. Mind if I explain?
      review_reachability: >
        Hi, I'm Sophie from PracticeDesk. First — your reviews are lovely, patients
        clearly think the world of you. I did notice one or two mention it can be
        tricky to get through on the phone, which honestly happens to every busy
        practice. That's the one thing we help with. Thirty seconds?
      after_hours_voicemail: >
        Hi, I'm Sophie from PracticeDesk. I actually tried your line yesterday
        evening after you'd closed and it went to voicemail — totally normal,
        everyone's shut by then. The thing is, most patients won't leave a message,
        they just call the next practice. That's exactly the gap we close, around
        the clock. Worth thirty seconds?
      new_business: >
        Hi, I'm Sophie from PracticeDesk — first, congratulations on opening,
        that's exciting. The tricky part early on is making sure every first-time
        caller actually becomes a booked patient while you're still building your
        base. We give new practices a 24/7 front office across phone, WhatsApp and
        email from day one — so you never miss an inquiry and you look established
        from the start. Could I share how, in thirty seconds?


