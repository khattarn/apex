  pricing_line_usd: "Plans from $49/month. Setup fee $180 — waived until 29 Jul 2026. 14-day free trial, live in 15 minutes, no lock-in."
  pricing_line_cad: "Plans from CAD $70/month. Setup fee CAD $250 — waived until 29 Jul 2026. 14-day free trial, live in 15 minutes, no lock-in."

