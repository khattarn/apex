          <p>If it goes to voicemail, that's the experience every after-hours patient gets — and most of them hang up and dial the next dentist instead of leaving a message.</p>
          <p>PracticeDesk answers that call. Every time. It books the appointment over phone or WhatsApp, sends a confirmation, and waits for your one-click approval before anything is final. You stay in control; the front desk just stops sleeping.</p>
          <p><a href="{DEMO_LINK}">Hear the AI take a booking &rarr;</a></p>

      - step: 3   # Day 6 — proof / outcome
