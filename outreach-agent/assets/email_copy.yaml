# ─────────────────────────────────────────────────────────────────────────────
# email_copy.yaml  —  Vertical-aware email sequence library  (PracticeDesk)
#
# WHY THIS FILE EXISTS
#   The old email path (agents/email_templates.py) hard-coded dental copy and was
#   sent to every vertical — salons, accountants and lawyers all received
#   "Dear Doctor … 73% of dental practices…". This file replaces that with one
#   sequence PER vertical, selected at send time by lead.business_type.
#
# HOW IT IS CONSUMED  (wired in VS Code / Claude Code — see handoff prompt)
#   generate_email(lead) → vertical = lead["business_type"] →
#   sequence = email_copy["verticals"][vertical]["sequence"][step] →
#   existing _render() interpolates the placeholders below into the HTML shell.
#
# PLACEHOLDERS (already supported by the current _render / variables dict)
#   {PRACTICE_NAME}  {CITY}  {STATE}  {DEMO_LINK}  {PRODUCT_URL}
#   {SENDER_NAME}    {INBOUND_PHONE}
#
# SEQUENCE CADENCE (maps to existing EMAIL_SEQUENCE day spacing)
#   step 1 = Day 1  (the hook)      step 3 = Day 6  (proof / outcome)
#   step 2 = Day 3  (the test)      step 4 = Day 9  (objection + break-up)
#
# RULES BAKED IN (from knowledge/brand/practicedesk-brief.md)
#   • Positioning: "AI office assistant across phone, WhatsApp and email — 24/7".
#     Never "WhatsApp assistant", never "chatbot".
#   • Always sign off as Henry, PracticeDesk.
#   • Every claim/stat below is from the brand brief — do not inflate.
#   • Compliance footer + tracking pixel + CTA buttons are added by _render(),
#     NOT here. This file is body copy only.
#   • A/B: two subject lines per email. Preheader = the inbox "hook" line.
# ─────────────────────────────────────────────────────────────────────────────

